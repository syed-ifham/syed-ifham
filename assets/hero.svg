<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="auto">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#0d0e17"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="50%" style="stop-color:#bb9af7"/>
      <stop offset="100%" style="stop-color:#7dcfff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="900" height="200" fill="url(#hero-bg)" rx="12"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#7aa2f7" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
  </g>
  <!-- Floating particles -->
  <circle cx="50" cy="30" r="2" fill="#7aa2f7" opacity="0.6">
    <animate attributeName="cy" values="30;20;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="170" r="1.5" fill="#bb9af7" opacity="0.6">
    <animate attributeName="cy" values="170;160;170" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="15" r="1" fill="#7dcfff" opacity="0.8">
    <animate attributeName="cy" values="15;5;15" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="50" r="2" fill="#7aa2f7" opacity="0.5">
    <animate attributeName="cy" values="50;40;50" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="150" r="1.5" fill="#7dcfff" opacity="0.5">
    <animate attributeName="cy" values="150;140;150" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Title text -->
  <text x="450" y="90" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="url(#text-grad)" text-anchor="middle" filter="url(#glow)">Syed Ifham Hussain</text>
  <!-- Subtitle -->
  <text x="450" y="125" font-family="'Courier New', monospace" font-size="14" fill="#a9b1d6" text-anchor="middle">AI Developer • Java Backend Engineer • Full Stack</text>
  <!-- Animated underline -->
  <rect x="225" y="135" width="450" height="1" fill="url(#text-grad)" opacity="0.5">
    <animate attributeName="width" values="0;450;0" dur="3s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="x" values="450;225;450" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Tagline -->
  <text x="450" y="165" font-family="'Courier New', monospace" font-size="11" fill="#565f89" text-anchor="middle">Building AI Systems • Cloud • Open Source • Competitive Programming</text>
</svg>
